name: Application validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit SHA for changed-file validation
        required: false
        type: string
        default: ''
      source_sha:
        description: Exact commit SHA to validate
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      base_sha:
        description: Exact base commit SHA for changed-file validation
        required: false
        type: string
        default: ''
      source_sha:
        description: Exact commit SHA to validate
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: application-validation-${{ inputs.source_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-identity:
    name: Exact validation source identity
    runs-on: ubuntu-24.04
    steps:
      - name: Bind requested source to check-run revision
        shell: bash
        env:
          CHECK_RUN_SHA: ${{ github.sha }}
          VALIDATION_SOURCE_SHA: ${{ inputs.source_sha }}
          VALIDATION_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$VALIDATION_SOURCE_SHA" ]]; then
            exit 0
          fi
          [[ "$VALIDATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "The requested validation source is not a full lowercase commit SHA." >&2
            exit 1
          }
          if [[ "$VALIDATION_SOURCE_SHA" == "$CHECK_RUN_SHA" ]]; then
            exit 0
          fi
          # Gate shape: a reusable-workflow caller (the v4.x candidate gate)
          # validates a candidate that descends from the frozen base this run
          # executes on. github.event_name stays the caller's trigger, so the
          # shape is recognized by the frozen base input instead. The caller
          # binds the exact candidate ref to the requested SHA and attests
          # the check to it; the binding here proves the run executes on the
          # declared base.
          if [[ -n "$VALIDATION_BASE_SHA" && "$CHECK_RUN_SHA" == "$VALIDATION_BASE_SHA" ]]; then
            exit 0
          fi
          echo "The requested validation source does not match the check-run revision." >&2
          exit 1

  php:
    name: PHP 8.5 application
    needs: source-identity
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_MAINTENANCE_DRIVER: file
      CACHE_STORE: array
      DB_CONNECTION: testing
      QUEUE_CONNECTION: sync
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, pdo_sqlite, redis
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: npm ci
      - name: Build application assets
        run: npm run build
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction
      - name: Discover packages and boot the application
        run: |
          php artisan package:discover --ansi
          php artisan about --only=environment
      - name: Run release and version-consumer tests
        run: |
          set -Eeuo pipefail
          php artisan test --compact \
            tests/Unit/ApplicationValidationWorkflowTest.php \
            tests/Unit/CheckHelperImageJobTest.php \
            tests/Unit/CheckForUpdatesJobTest.php \
            tests/Unit/GenerateChangelogWorkflowTest.php \
            tests/Unit/ProductionImageRuntimeContentTest.php \
            tests/Unit/ProductionImageSupplyChainWorkflowTest.php \
            tests/Unit/ReleaseOperationalAcceptanceWorkflowTest.php \
            tests/Unit/ReleasePlatformAcceptanceWorkflowTest.php \
            tests/Unit/ReleasePublicationSerializationTest.php \
            tests/Unit/ReleaseVersionConsumerContractTest.php \
            tests/Unit/SentinelVersionTest.php \
            tests/Unit/StagingImageReferenceWorkflowTest.php \
            tests/Unit/UpdateCoolifyTest.php \
            tests/Feature/ForkVersionConsumerTest.php \
            tests/Feature/ProductionSeederTest.php \
            tests/Feature/ReverbAndTerminalPackagingTest.php \
            tests/Feature/UpgradeComponentTest.php
      - name: Run native Traefik control-plane tests
        run: |
          set -Eeuo pipefail
          mapfile -t control_plane_feature_tests < <(
            find tests/Feature/Proxy/ControlPlane -maxdepth 1 -type f -name '*Test.php' \
              ! -name 'ProveAndFreezeControlPlaneGenerationTest.php' -print | sort
          )
          (( ${#control_plane_feature_tests[@]} > 0 ))
          php artisan test --compact \
            tests/Feature/InspectProxyMutationQueueTest.php \
            "${control_plane_feature_tests[@]}" \
            tests/Unit/Actions/Proxy/ControlPlane
      - name: Run control-plane backup-quiesce owner
        run: php artisan test --compact tests/Feature/Proxy/ControlPlane/ProveAndFreezeControlPlaneGenerationTest.php

  blue-green-lifecycle:
    name: Blue-green lifecycle (PostgreSQL)
    needs: source-identity
    runs-on: ubuntu-24.04
    # This lane carries the whole blue-green manifest against a real
    # PostgreSQL, and it grows with the recovery profiles it proves. It spent
    # 17m43s of a 20m budget on 4.13.86-fork and exceeded it on the next
    # release, cancelling mid-suite -- a capacity signal reported as a failure,
    # which is the least useful shape a red lane can take. 30m matches its
    # sibling lanes and leaves real headroom; the cost of a genuinely hung run
    # is ten more minutes, against repeatedly re-releasing to discover the
    # budget was simply too small.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: coolify_testing
          POSTGRES_PASSWORD: coolify-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coolify_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_MAINTENANCE_DRIVER: file
      CACHE_STORE: array
      COOLIFY_EXTERNAL_TEST_SERVICES: true
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: coolify_testing
      DB_USERNAME: postgres
      DB_PASSWORD: coolify-tests
      QUEUE_CONNECTION: sync
      REDIS_URL: ''
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_DB: 1
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ''
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, pcntl, pdo_pgsql, redis
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Run canonical blue-green PostgreSQL tests
        run: bash scripts/dev/test-blue-green-postgresql.sh external

  unit-suite:
    name: Unit suite (single process)
    needs: source-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_MAINTENANCE_DRIVER: file
      CACHE_STORE: array
      DB_CONNECTION: testing
      QUEUE_CONNECTION: sync
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, pdo_sqlite, redis
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Run the whole unit directory in one process
        run: php -d memory_limit=2G vendor/bin/pest --compact --do-not-cache-result tests/Unit

  browser:
    name: Pest browser tests
    needs: source-identity
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_MAINTENANCE_DRIVER: file
      CACHE_STORE: array
      DB_CONNECTION: testing
      DB_DATABASE: database/browser-testing.sqlite
      QUEUE_CONNECTION: sync
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, pdo_sqlite
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: npm ci
      - name: Prepare file-backed browser database
        run: touch database/browser-testing.sqlite
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build browser assets
        run: npm run build
      - name: Run Pest browser tests
        run: php artisan test --compact tests/v4/Browser

  formatting:
    name: PHP formatting
    needs: source-identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Format and require a clean tree
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          VALIDATION_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          base_sha="${BASE_SHA:-}"
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse "${VALIDATION_SOURCE_SHA}^" 2>/dev/null || printf '%s' 4b825dc642cb6eb9a060e54bf8d69288fbee4904)"
          fi
          mapfile -d '' php_paths < <(git diff --name-only -z --diff-filter=ACMR "$base_sha" "$VALIDATION_SOURCE_SHA" -- '*.php')
          if (( ${#php_paths[@]} > 0 )); then
            vendor/bin/pint --format agent -- "${php_paths[@]}"
          fi
          git diff --exit-code

  node:
    name: Node 22 application
    needs: source-identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  workflow-and-shell:
    name: Workflow and shell contracts
    needs: source-identity
    runs-on: ubuntu-24.04
    env:
      OWNED_WORKFLOWS: >-
        .github/workflows/application-validation.yml
        .github/workflows/coolify-production-build.yml
        .github/workflows/coolify-staging-build.yml
        .github/workflows/coolify-testing-host.yml
        .github/workflows/generate-changelog.yml
        .github/workflows/publish-fork.yml
        .github/workflows/publish-linux-image.yml
        .github/workflows/release-operational-acceptance.yml
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Validate workflows
        run: |
          read -r -a workflows <<< "$OWNED_WORKFLOWS"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 "${workflows[@]}"
      - name: Verify pinned source provenance
        run: |
          docker/verify-source-provenance.sh docker/production/Dockerfile
          docker/verify-source-provenance.sh docker/testing-host/Dockerfile
      - name: Run release publication shell integrations
        run: |
          scripts/ci/deriveImageTags.test.sh
          tests/Integration/PublishLinuxImageScriptTest.sh
          tests/Integration/ReleaseOperationalFixturesTest.sh
          tests/Integration/VerifyNexusDockerWritePolicyTest.sh
          tests/Integration/VerifyForkReleaseTagTest.sh
          tests/Integration/DownloadGitHubReleaseAssetTest.sh
          tests/Integration/DockerSsotCleanTest.sh
          tests/Integration/ProductionApplicationBlueGreen/SanitizeEvidenceTest.sh
          tests/Integration/ControlPlaneMigrateTest.sh
      - name: Verify Docker daemon configuration ownership
        run: tests/Integration/DockerDaemonConfigurationTest.sh
      - name: Verify database migration S6 exit propagation
        run: tests/Integration/DatabaseMigrationS6/run.sh
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, pdo_sqlite, redis
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Run native Traefik runtime integration
        run: tests/Integration/ControlPlaneTraefik/run.sh
      - name: Require immutable external action and container references
        shell: bash
        run: |
          read -r -a workflows <<< "$OWNED_WORKFLOWS"
          if grep -nP 'uses:\s+(?!\./)[^@\s]+@(?![0-9a-f]{40}(?:\s|$))' "${workflows[@]}"; then
            echo 'External GitHub Actions must be pinned to a full commit SHA.' >&2
            exit 1
          fi
          if grep -nP '^(?: {6}| {8})image:\s+(?![^\s]+@sha256:[0-9a-f]{64}(?:\s|$))' "${workflows[@]}"; then
            echo 'Workflow job container and service images must be pinned to an immutable SHA-256 digest.' >&2
            exit 1
          fi
      - name: ShellCheck changed shell scripts
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          VALIDATION_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          base_sha="${BASE_SHA:-}"
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse "${VALIDATION_SOURCE_SHA}^" 2>/dev/null || printf '%s' 4b825dc642cb6eb9a060e54bf8d69288fbee4904)"
          fi
          mapfile -d '' changed_paths < <(git diff --name-only -z --diff-filter=ACMR "$base_sha" "$VALIDATION_SOURCE_SHA")
          strict_scripts=()
          legacy_scripts=()
          for path in "${changed_paths[@]}"; do
            [[ -f "$path" ]] || continue

            if [[ "$path" == *.sh ]]; then
              is_shell=true
            else
              first_line=''
              IFS= read -r first_line < "$path" || :
              is_shell=false
              if [[ -x "$path" && "$first_line" =~ ^\#!.*(ba|da|k)?sh([[:space:]]|$) ]]; then
                is_shell=true
              fi
            fi
            [[ "$is_shell" == true ]] || continue

            if git diff --quiet --diff-filter=A "$base_sha" "$VALIDATION_SOURCE_SHA" -- "$path"; then
              legacy_scripts+=("$path")
            else
              strict_scripts+=("$path")
            fi
          done
          if (( ${#strict_scripts[@]} > 0 )); then
            shellcheck -e SC2015 -- "${strict_scripts[@]}"
          fi
          if (( ${#legacy_scripts[@]} > 0 )); then
            shellcheck --severity=error -e SC2015 -- "${legacy_scripts[@]}"
          fi
      - name: Run release entrypoint contract tests
        run: scripts/dev/ship.test.sh

  testing-host-runtime:
    name: Testing-host production identity bridge
    needs: source-identity
    if: ${{ github.event_name == 'pull_request' || inputs.source_sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Build exact testing-host source image without publication
        env:
          TESTING_HOST_IMAGE: coolify-testing-host:application-validation-${{ inputs.source_sha || github.sha }}
        run: |
          docker buildx build --load --pull \
            --file docker/testing-host/Dockerfile \
            --tag "$TESTING_HOST_IMAGE" \
            .
      - name: Build exact production source image without publication
        env:
          PRODUCTION_IMAGE: coolify:application-validation-${{ inputs.source_sha || github.sha }}
        run: |
          docker buildx build --load --pull \
            --file docker/production/Dockerfile \
            --tag "$PRODUCTION_IMAGE" \
            .
      - name: Run exact testing-host runtime contract
        env:
          PRODUCTION_IMAGE: coolify:application-validation-${{ inputs.source_sha || github.sha }}
          TESTING_HOST_IMAGE: coolify-testing-host:application-validation-${{ inputs.source_sha || github.sha }}
        run: tests/Integration/TestingHostImageTest.sh
      - name: Run exact bundled Reverb and terminal runtime contract
        env:
          PRODUCTION_IMAGE: coolify:application-validation-${{ inputs.source_sha || github.sha }}
        run: tests/Integration/RealtimeImageTest.sh
      - name: Run production application blue-green deployment contract
        env:
          EVIDENCE_PARENT: ${{ runner.temp }}/production-application-blue-green-evidence
          PRODUCTION_APPLICATION_BLUE_GREEN_EVIDENCE_DIRECTORY: ${{ runner.temp }}/production-application-blue-green-evidence
          PRODUCTION_IMAGE: coolify:application-validation-${{ inputs.source_sha || github.sha }}
          TESTING_HOST_IMAGE: coolify-testing-host:application-validation-${{ inputs.source_sha || github.sha }}
        run: |
          install -d -m 0700 "$EVIDENCE_PARENT"
          tests/Integration/ProductionApplicationBlueGreen/run.sh
      - name: Sanitize production application blue-green evidence
        if: always()
        shell: bash
        env:
          RAW_EVIDENCE_PARENT: ${{ runner.temp }}/production-application-blue-green-evidence
          SANITIZED_EVIDENCE_PARENT: ${{ runner.temp }}/production-application-blue-green-sanitized
        run: |
          set -Eeuo pipefail
          python3 tests/Integration/ProductionApplicationBlueGreen/sanitize-evidence.py \
            "$RAW_EVIDENCE_PARENT" "$SANITIZED_EVIDENCE_PARENT"
      - name: Retain sanitized production application blue-green evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: production-application-blue-green-${{ inputs.source_sha || github.sha }}
          path: ${{ runner.temp }}/production-application-blue-green-sanitized/**
          retention-days: 7

  fork-deploy:
    name: Signed fork deployment contract
    needs: source-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Run signed fork deployment integration
        run: tests/Integration/ForkDeploy/run.sh

  required:
    name: Application validation required
    if: always()
    needs:
      - blue-green-lifecycle
      - php
      - browser
      - formatting
      - fork-deploy
      - node
      - source-identity
      - testing-host-runtime
      - unit-suite
      - workflow-and-shell
    runs-on: ubuntu-24.04
    steps:
      - name: Require every generic validation job
        shell: bash
        env:
          BLUE_GREEN_LIFECYCLE_RESULT: ${{ needs.blue-green-lifecycle.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          EVENT_NAME: ${{ github.event_name }}
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          FORK_DEPLOY_RESULT: ${{ needs.fork-deploy.result }}
          NODE_RESULT: ${{ needs.node.result }}
          PHP_RESULT: ${{ needs.php.result }}
          SOURCE_IDENTITY_RESULT: ${{ needs.source-identity.result }}
          VALIDATION_SOURCE_SHA: ${{ inputs.source_sha }}
          TESTING_HOST_RUNTIME_RESULT: ${{ needs.testing-host-runtime.result }}
          UNIT_SUITE_RESULT: ${{ needs.unit-suite.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-and-shell.result }}
        run: |
          set -Eeuo pipefail
          for result in \
            "$BLUE_GREEN_LIFECYCLE_RESULT" \
            "$PHP_RESULT" \
            "$BROWSER_RESULT" \
            "$FORMATTING_RESULT" \
            "$FORK_DEPLOY_RESULT" \
            "$NODE_RESULT" \
            "$SOURCE_IDENTITY_RESULT" \
            "$UNIT_SUITE_RESULT" \
            "$WORKFLOW_RESULT"; do
            [[ "$result" == success ]] || {
              echo "A required generic application validation job did not succeed: $result" >&2
              exit 1
            }
          done
          if [[ "$EVENT_NAME" == pull_request || -n "$VALIDATION_SOURCE_SHA" ]]; then
            [[ "$TESTING_HOST_RUNTIME_RESULT" == success ]] || {
              echo "Testing-host runtime validation did not succeed for the exact source: $TESTING_HOST_RUNTIME_RESULT" >&2
              exit 1
            }
          else
            [[ "$TESTING_HOST_RUNTIME_RESULT" == skipped ]] || {
              echo "Testing-host runtime validation must be skipped without an exact source: $TESTING_HOST_RUNTIME_RESULT" >&2
              exit 1
            }
          fi
