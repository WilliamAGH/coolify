# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Gate v4.x candidate
run-name: Gate v4.x ${{ inputs.candidate_sha }} ${{ inputs.candidate_ref }} from ${{ inputs.base_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA
        required: true
        type: string
      candidate_ref:
        description: Immutable candidate branch containing the commit
        required: true
        type: string
      base_sha:
        description: v4.x SHA the candidate was based on
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize immutable v4.x candidate
    permissions:
      contents: read
    runs-on:
      group: coolify-trusted
      labels: [self-hosted, Linux, X64, williamacallahan]
    timeout-minutes: 10
    env:
      FROZEN_BASE_SHA: ${{ inputs.base_sha }}
      FROZEN_CANDIDATE_REF: ${{ inputs.candidate_ref }}
      FROZEN_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Authorize immutable candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$FROZEN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FROZEN_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FROZEN_CANDIDATE_REF" =~ ^ship/v4x/$FROZEN_SHA/[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == refs/heads/v4.x ]]
          [[ "$GITHUB_SHA" == "$FROZEN_BASE_SHA" ]]

      - name: Resolve immutable candidate ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        env:
          FROZEN_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          FROZEN_SHA: ${{ inputs.candidate_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const candidate = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${process.env.FROZEN_CANDIDATE_REF}`,
            });
            if (candidate.data.object.type !== 'commit' || candidate.data.object.sha !== process.env.FROZEN_SHA) {
              core.setFailed('Candidate ref does not resolve to the requested commit SHA.');
            }
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${process.env.FROZEN_BASE_SHA}...${process.env.FROZEN_SHA}`,
            });
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              core.setFailed('Candidate commit is not descended from the frozen v4.x base.');
            }

  application-validation:
    name: Validate immutable v4.x candidate
    needs: authorize
    concurrency:
      group: v4x-candidate-${{ inputs.candidate_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/application-validation.yml
    with:
      base_sha: ${{ inputs.base_sha }}
      source_sha: ${{ inputs.candidate_sha }}
