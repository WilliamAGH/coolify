name: Production Build (v4)

on:
  push:
    branches: ["v4.x"]
    paths-ignore:
      - .github/workflows/coolify-helper.yml
      - .github/workflows/coolify-helper-next.yml
      - .github/workflows/pr-quality.yaml
      - docker/coolify-helper/**
      - docker/testing-host/**
      - CHANGELOG.md

permissions: {}

jobs:
  candidate-preflight:
    name: Reuse trusted v4.x candidate preflight
    if: ${{ github.repository == 'williamacallahan/coolify' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - id: trusted_base
        name: Check out protected base verifier
        continue-on-error: true
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.before }}
          path: trusted-v4x

      - id: verify
        name: Verify exact candidate preflight
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          CANDIDATE_SHA: ${{ github.sha }}
          CHECKOUT_OUTCOME: ${{ steps.trusted_base.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          verified=false
          if [[ "$CHECKOUT_OUTCOME" == success ]] &&
            [[ -x trusted-v4x/scripts/ci/verify-v4x-candidate-gate.sh ]] &&
            trusted-v4x/scripts/ci/verify-v4x-candidate-gate.sh "$CANDIDATE_SHA" "$BASE_SHA"; then
            verified=true
          else
            echo 'No trusted candidate preflight matched this v4.x push; hosted validation will run.'
          fi
          printf 'verified=%s\n' "$verified" >> "$GITHUB_OUTPUT"

  application-validation:
    name: Validate application before image publication
    needs: candidate-preflight
    if: ${{ always() && needs.candidate-preflight.outputs.verified != 'true' }}
    uses: ./.github/workflows/application-validation.yml
    permissions:
      contents: read
    with:
      base_sha: ${{ github.event.before }}
      source_sha: ${{ github.sha }}

  validation-required:
    name: Require trusted preflight or hosted validation
    needs: [candidate-preflight, application-validation]
    if: always()
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Require a successful validation path
        shell: bash
        env:
          HOSTED_VALIDATION_RESULT: ${{ needs.application-validation.result }}
          PREFLIGHT_RESULT: ${{ needs.candidate-preflight.result }}
          PREFLIGHT_VERIFIED: ${{ needs.candidate-preflight.outputs.verified }}
        run: |
          set -Eeuo pipefail
          if [[ "$PREFLIGHT_RESULT" == success && "$PREFLIGHT_VERIFIED" == true ]]; then
            exit 0
          fi
          [[ "$HOSTED_VALIDATION_RESULT" == success ]]

  resolve-version:
    name: Resolve production version
    needs: validation-required
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: version
        name: Read semantic version from bootstrap
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SEMANTIC_VERSION_PATTERN: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*)))*)?$'
        run: |
          set -eu
          version="$(php bootstrap/getVersion.php)"
          printf '%s' "$version" | grep -Eq "$SEMANTIC_VERSION_PATTERN"
          [ "$(jq -er '.coolify.v4.version' versions.json)" = "$version" ]

          should_publish=false
          if printf '%s' "$BEFORE_SHA" | grep -Eq '^[0-9a-f]{40}$' &&
            [ "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]; then
            git cat-file -e "${BEFORE_SHA}^{commit}"
            previous_constants="$RUNNER_TEMP/coolify-previous-constants.php"
            git show "${BEFORE_SHA}:config/constants.php" > "$previous_constants"
            # PHP receives its own positional arguments.
            # shellcheck disable=SC2016
            previous_version="$(php -r 'function env() { return null; } $constants = include $argv[1]; echo $constants["coolify"]["version"] ?? "";' "$previous_constants")"
            printf '%s' "$previous_version" | grep -Eq "$SEMANTIC_VERSION_PATTERN"

            # The serialized publisher decides whether this version is already
            # present. Equal versions must reach it because GitHub may replace
            # an intermediate pending bump run with a later unchanged push.
            # shellcheck disable=SC2016
            php -r 'exit(version_compare($argv[1], $argv[2], ">=") ? 0 : 1);' "$version" "$previous_version" || {
              printf 'Production version must not decrease: %s -> %s\n' "$previous_version" "$version" >&2
              exit 1
            }
            should_publish=true
          fi

          printf 'should_publish=%s\n' "$should_publish" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish production Linux image
    if: ${{ needs.resolve-version.outputs.should_publish == 'true' }}
    needs: resolve-version
    concurrency:
      group: linux-image-release-coollabsio/coolify
      cancel-in-progress: false
    uses: ./.github/workflows/publish-linux-image.yml
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    with:
      artifact_name: coolify
      candidate_repository: coollabsio/coolify-production-staging
      dockerfile: docker/production/Dockerfile
      publish_latest: true
      release_kind: production
      semantic_version: ${{ needs.resolve-version.outputs.version }}
      target_repository: coollabsio/coolify
      validate_only: ${{ github.repository != 'coollabsio/coolify' }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
