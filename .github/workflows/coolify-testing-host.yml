name: Coolify Testing Host

on:
  push:
    branches: ["next"]
    paths:
      - .github/workflows/application-validation.yml
      - .github/workflows/coolify-testing-host.yml
      - .github/workflows/publish-linux-image.yml
      - docker-compose-maxio.dev.yml
      - docker-compose.dev.yml
      - docker-compose.windows.yml
      - docker/testing-host/**
      - docker/verify-source-provenance.sh
      - other/nightly/docker-compose.windows.yml
      - scripts/publish-linux-image.sh
      - tests/Integration/TestingHostImageTest.sh
      - tests/Integration/VerifyOciArchiveImage.sh
  workflow_dispatch:

permissions: {}

jobs:
  authorize:
    name: Authorize canonical release source
    if: ${{ github.repository == 'coollabsio/coolify' && github.ref == 'refs/heads/next' }}
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the canonical repository and branch
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          [ "$REPOSITORY" = 'coollabsio/coolify' ]
          [ "$REF" = 'refs/heads/next' ]

  application-validation:
    name: Validate application before image publication
    needs: authorize
    uses: ./.github/workflows/application-validation.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ github.sha }}

  publish:
    name: Build and publish testing-host Linux image
    needs: application-validation
    concurrency:
      group: linux-image-release-coollabsio/coolify-testing-host
      cancel-in-progress: false
    uses: ./.github/workflows/publish-linux-image.yml
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    with:
      artifact_name: coolify-testing-host
      candidate_repository: coollabsio/coolify-testing-host-staging
      dockerfile: docker/testing-host/Dockerfile
      publish_latest: true
      release_kind: testing-host
      semantic_version: ''
      target_repository: coollabsio/coolify-testing-host
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
