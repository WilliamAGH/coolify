# This lane is only for a separately provisioned, disposable clone database.
# It does not join the live Coolify network and never starts a web server.
services:
  migration-rehearsal:
    image: "${CONTROL_PLANE_GREEN_IMAGE:?CONTROL_PLANE_GREEN_IMAGE must be an immutable digest reference}"
    restart: "no"
    env_file:
      - "${CONTROL_PLANE_REHEARSAL_RUNTIME_ENV_FILE:?CONTROL_PLANE_REHEARSAL_RUNTIME_ENV_FILE is required}"
    environment:
      CONTROL_PLANE_MODE: active
      CONTROL_PLANE_STARTUP_MODE: full
      CONTROL_PLANE_MIGRATION_REHEARSAL: "true"
      CONTROL_PLANE_LIVE_DATABASE_SYSTEM_IDENTIFIER: "${CONTROL_PLANE_LIVE_DATABASE_SYSTEM_IDENTIFIER:?CONTROL_PLANE_LIVE_DATABASE_SYSTEM_IDENTIFIER is required}"
      CONTROL_PLANE_EXPECTED_MIGRATION_LEDGER_SHA256: "${CONTROL_PLANE_EXPECTED_MIGRATION_LEDGER_SHA256:?CONTROL_PLANE_EXPECTED_MIGRATION_LEDGER_SHA256 is required}"
      CONTROL_PLANE_EXPECTED_MIGRATION_PENDING_SHA256: "${CONTROL_PLANE_EXPECTED_MIGRATION_PENDING_SHA256:?CONTROL_PLANE_EXPECTED_MIGRATION_PENDING_SHA256 is required}"
      CONTROL_PLANE_EXPECTED_MIGRATION_BATCH: "${CONTROL_PLANE_EXPECTED_MIGRATION_BATCH:?CONTROL_PLANE_EXPECTED_MIGRATION_BATCH is required}"
      CONTROL_PLANE_MIGRATION_LOCK_TIMEOUT: "${CONTROL_PLANE_MIGRATION_LOCK_TIMEOUT:?CONTROL_PLANE_MIGRATION_LOCK_TIMEOUT is required}"
      CONTROL_PLANE_MIGRATION_STATEMENT_TIMEOUT: "${CONTROL_PLANE_MIGRATION_STATEMENT_TIMEOUT:?CONTROL_PLANE_MIGRATION_STATEMENT_TIMEOUT is required}"
      AUTORUN_ENABLED: "false"
      INIT_ENABLED: "false"
      SEEDER_ENABLED: "false"
      HORIZON_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      NIGHTWATCH_ENABLED: "false"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      exec env PGOPTIONS="-c lock_timeout=$${CONTROL_PLANE_MIGRATION_LOCK_TIMEOUT} -c statement_timeout=$${CONTROL_PLANE_MIGRATION_STATEMENT_TIMEOUT}" php artisan start:migration --control-plane-expand
    networks:
      - rehearsal

  # This is the live additive-expand step. It runs before the proxy route moves
  # from blue to green and deliberately uses the same immutable green image.
  live-expand-migrations:
    image: "${CONTROL_PLANE_GREEN_IMAGE:?CONTROL_PLANE_GREEN_IMAGE must be an immutable digest reference}"
    container_name: "${CONTROL_PLANE_MIGRATION_RUNNER_NAME:-coolify-control-plane-unused-live-expand}"
    restart: "no"
    env_file:
      - "${CONTROL_PLANE_RUNTIME_ENV_FILE:?CONTROL_PLANE_RUNTIME_ENV_FILE is required}"
    environment:
      CONTROL_PLANE_MODE: active
      CONTROL_PLANE_STARTUP_MODE: full
      CONTROL_PLANE_LIVE_EXPAND_MIGRATION: "true"
      CONTROL_PLANE_EXPECTED_DATABASE_IDENTITY_SHA256: "${CONTROL_PLANE_EXPECTED_DATABASE_IDENTITY_SHA256:-unavailable}"
      CONTROL_PLANE_LIVE_DATABASE_SYSTEM_IDENTIFIER: "${CONTROL_PLANE_LIVE_DATABASE_SYSTEM_IDENTIFIER:?CONTROL_PLANE_LIVE_DATABASE_SYSTEM_IDENTIFIER is required}"
      CONTROL_PLANE_EXPECTED_MIGRATION_LEDGER_SHA256: "${CONTROL_PLANE_EXPECTED_MIGRATION_LEDGER_SHA256:?CONTROL_PLANE_EXPECTED_MIGRATION_LEDGER_SHA256 is required}"
      CONTROL_PLANE_EXPECTED_MIGRATION_PENDING_SHA256: "${CONTROL_PLANE_EXPECTED_MIGRATION_PENDING_SHA256:?CONTROL_PLANE_EXPECTED_MIGRATION_PENDING_SHA256 is required}"
      CONTROL_PLANE_EXPECTED_MIGRATION_BATCH: "${CONTROL_PLANE_EXPECTED_MIGRATION_BATCH:?CONTROL_PLANE_EXPECTED_MIGRATION_BATCH is required}"
      CONTROL_PLANE_MIGRATION_LOCK_TIMEOUT: "${CONTROL_PLANE_MIGRATION_LOCK_TIMEOUT:?CONTROL_PLANE_MIGRATION_LOCK_TIMEOUT is required}"
      CONTROL_PLANE_MIGRATION_STATEMENT_TIMEOUT: "${CONTROL_PLANE_MIGRATION_STATEMENT_TIMEOUT:?CONTROL_PLANE_MIGRATION_STATEMENT_TIMEOUT is required}"
      CONTROL_PLANE_MIGRATION_OPERATION_ID: "${CONTROL_PLANE_MIGRATION_OPERATION_ID:-unused}"
      CONTROL_PLANE_MIGRATION_ATTEMPT: "${CONTROL_PLANE_MIGRATION_ATTEMPT:-unused}"
      CONTROL_PLANE_MIGRATION_APPLICATION_NAME: "${CONTROL_PLANE_MIGRATION_APPLICATION_NAME:-unused}"
      CONTROL_PLANE_MIGRATION_ATTEMPT_LOCK_IDENTITY: "${CONTROL_PLANE_MIGRATION_ATTEMPT_LOCK_IDENTITY:-unused}"
      AUTORUN_ENABLED: "false"
      INIT_ENABLED: "false"
      SEEDER_ENABLED: "false"
      HORIZON_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      NIGHTWATCH_ENABLED: "false"
    labels:
      io.coolify.control-plane.operation-id: "${CONTROL_PLANE_MIGRATION_OPERATION_ID:-unused}"
      io.coolify.control-plane.migration-attempt: "${CONTROL_PLANE_MIGRATION_ATTEMPT:-unused}"
      io.coolify.control-plane.pg-application-name: "${CONTROL_PLANE_MIGRATION_APPLICATION_NAME:-unused}"
      io.coolify.control-plane.migration-attempt-lock: "${CONTROL_PLANE_MIGRATION_ATTEMPT_LOCK_IDENTITY:-unused}"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      exec env PGOPTIONS="-c lock_timeout=$${CONTROL_PLANE_MIGRATION_LOCK_TIMEOUT} -c statement_timeout=$${CONTROL_PLANE_MIGRATION_STATEMENT_TIMEOUT}" php artisan start:migration --control-plane-expand
    networks:
      - control-plane

networks:
  rehearsal:
    name: "${CONTROL_PLANE_REHEARSAL_NETWORK:?CONTROL_PLANE_REHEARSAL_NETWORK is required}"
    external: true
  control-plane:
    name: "${CONTROL_PLANE_NETWORK:?CONTROL_PLANE_NETWORK is required}"
    external: true
