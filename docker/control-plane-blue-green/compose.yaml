# The operator owns two explicit web members per candidate generation. It never
# scales a service and never manages the bootstrap legacy `coolify` container or
# the existing proxy.
services:
  green-web-a:
    image: "${CONTROL_PLANE_GREEN_IMAGE:?CONTROL_PLANE_GREEN_IMAGE must be an immutable digest reference}"
    container_name: "${CONTROL_PLANE_GREEN_WEB_A_CONTAINER:?CONTROL_PLANE_GREEN_WEB_A_CONTAINER is required}"
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - "${CONTROL_PLANE_RUNTIME_ENV_FILE:?CONTROL_PLANE_RUNTIME_ENV_FILE is required}"
    environment:
      CONTROL_PLANE_COLOR: green
      CONTROL_PLANE_MEMBER_ID: "${CONTROL_PLANE_GREEN_WEB_A_MEMBER_ID:?CONTROL_PLANE_GREEN_WEB_A_MEMBER_ID is required}"
      CONTROL_PLANE_MODE: active
      CONTROL_PLANE_STARTUP_MODE: web-only
      CONTROL_PLANE_WRITER_EPOCH: "${CONTROL_PLANE_GREEN_WEB_A_WRITER_EPOCH:-}"
      CONTROL_PLANE_WRITER_MARKER_PATH: "${CONTROL_PLANE_GREEN_WEB_A_WRITER_MARKER_PATH:-}"
      CONTROL_PLANE_WEB_EPOCH: "${CONTROL_PLANE_GREEN_WEB_A_WEB_EPOCH:?CONTROL_PLANE_GREEN_WEB_A_WEB_EPOCH is required}"
      CONTROL_PLANE_WEB_MARKER_PATH: /var/lib/coolify-control-plane/private/web-epoch
      CONTROL_PLANE_ROUTE_DRAIN_EPOCH: "${CONTROL_PLANE_GREEN_WEB_A_ROUTE_DRAIN_EPOCH:?CONTROL_PLANE_GREEN_WEB_A_ROUTE_DRAIN_EPOCH is required}"
      CONTROL_PLANE_ROUTE_DRAIN_MARKER_PATH: /var/lib/coolify-control-plane/private/route-drain-epoch
      CONTROL_PLANE_MUTATION_FREEZE_EPOCH: "${CONTROL_PLANE_MUTATION_FREEZE_EPOCH:?CONTROL_PLANE_MUTATION_FREEZE_EPOCH is required}"
      CONTROL_PLANE_MUTATION_FREEZE_MARKER_PATH: /var/lib/coolify-control-plane/coordination/mutation-freeze-epoch
      CONTROL_PLANE_POOL_ACK_PATH: /run/secrets/control-plane-pool-ack
      CONTROL_PLANE_TRUSTED_PROXY_ADDRESSES: "${CONTROL_PLANE_TRUSTED_PROXY_ADDRESSES:?CONTROL_PLANE_TRUSTED_PROXY_ADDRESSES is required}"
      CONTROL_PLANE_DIRECT_PROBE_PATH: "${CONTROL_PLANE_DIRECT_PROBE_PATH:?CONTROL_PLANE_DIRECT_PROBE_PATH is required}"
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "${CONTROL_PLANE_BACKEND_PORT:?CONTROL_PLANE_BACKEND_PORT is required}"
    ports:
      - "127.0.0.1:${CONTROL_PLANE_GREEN_WEB_A_LOOPBACK_PORT:?CONTROL_PLANE_GREEN_WEB_A_LOOPBACK_PORT is required}:${CONTROL_PLANE_BACKEND_PORT:?CONTROL_PLANE_BACKEND_PORT is required}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/control-plane-direct-probe-healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10
    labels:
      - "${CONTROL_PLANE_POOL_LABEL_KEY:?CONTROL_PLANE_POOL_LABEL_KEY is required}=${CONTROL_PLANE_GREEN_POOL_LABEL_VALUE:?CONTROL_PLANE_GREEN_POOL_LABEL_VALUE is required}"
      - "traefik.enable=true"
      - "traefik.docker.network=${CONTROL_PLANE_NETWORK:?CONTROL_PLANE_NETWORK is required}"
      - "traefik.http.routers.control-plane-green-web-a-discovery.rule=Host(`control-plane-green-web-a.invalid`)"
      - "traefik.http.routers.control-plane-green-web-a-discovery.entrypoints=${CONTROL_PLANE_LOCAL_INGRESS_ENTRYPOINT:-coolify-local}"
      - "traefik.http.routers.control-plane-green-web-a-discovery.service=control-plane-green-web-a"
      - "traefik.http.routers.control-plane-green-web-a-discovery.priority=1"
      - "traefik.http.services.control-plane-green-web-a.loadbalancer.server.port=${CONTROL_PLANE_BACKEND_PORT:?CONTROL_PLANE_BACKEND_PORT is required}"
      - "traefik.http.services.control-plane-green-web-a.loadbalancer.server.scheme=http"
      - "traefik.http.services.control-plane-green-web-a.loadbalancer.passhostheader=true"
      - "traefik.http.services.control-plane-green-web-a.loadbalancer.healthcheck.path=/api/control-plane/route-health"
      - "traefik.http.services.control-plane-green-web-a.loadbalancer.healthcheck.hostname=${CONTROL_PLANE_HOST:?CONTROL_PLANE_HOST is required}"
      - "traefik.http.services.control-plane-green-web-a.loadbalancer.healthcheck.headers.X-Control-Plane-Route-Health=${CONTROL_PLANE_GREEN_ROUTE_HEALTH_TOKEN:?CONTROL_PLANE_GREEN_ROUTE_HEALTH_TOKEN is required}"
      - "traefik.http.services.control-plane-green-web-a.loadbalancer.healthcheck.method=GET"
      - "traefik.http.services.control-plane-green-web-a.loadbalancer.healthcheck.status=204"
      - "traefik.http.services.control-plane-green-web-a.loadbalancer.healthcheck.interval=1s"
      - "traefik.http.services.control-plane-green-web-a.loadbalancer.healthcheck.unhealthyinterval=1s"
      - "traefik.http.services.control-plane-green-web-a.loadbalancer.healthcheck.timeout=1s"
      - "traefik.http.services.control-plane-green-web-a.loadbalancer.healthcheck.followredirects=false"
    networks: [control-plane]
    secrets:
      - source: green-web-a-direct-probe-token
        target: control-plane-direct-probe-token
      - source: green-web-a-applied-ack
        target: control-plane-applied-ack
      - source: green-pool-route-health-token
        target: control-plane-route-health-token
      - source: green-pool-ack
        target: control-plane-pool-ack
    volumes:
      - type: bind
        source: "${CONTROL_PLANE_RUNTIME_ENV_FILE:?CONTROL_PLANE_RUNTIME_ENV_FILE is required}"
        target: /var/www/html/.env
        read_only: true
      - "${CONTROL_PLANE_SSH_DIRECTORY:-/data/coolify/ssh}:/var/www/html/storage/app/ssh"
      - "${CONTROL_PLANE_APPLICATIONS_DIRECTORY:-/data/coolify/applications}:/var/www/html/storage/app/applications"
      - "${CONTROL_PLANE_DATABASES_DIRECTORY:-/data/coolify/databases}:/var/www/html/storage/app/databases"
      - "${CONTROL_PLANE_SERVICES_DIRECTORY:-/data/coolify/services}:/var/www/html/storage/app/services"
      - "${CONTROL_PLANE_BACKUPS_DIRECTORY:-/data/coolify/backups}:/var/www/html/storage/app/backups"
      - type: volume
        source: green-web-a-private
        target: /var/lib/coolify-control-plane/private
      - type: volume
        source: control-plane-coordination
        target: /var/lib/coolify-control-plane/coordination

