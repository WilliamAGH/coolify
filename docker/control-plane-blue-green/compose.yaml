      - "traefik.http.services.control-plane-blue-web-b.loadbalancer.healthcheck.status=204"
      - "traefik.http.services.control-plane-blue-web-b.loadbalancer.healthcheck.interval=1s"
      - "traefik.http.services.control-plane-blue-web-b.loadbalancer.healthcheck.unhealthyinterval=1s"
      - "traefik.http.services.control-plane-blue-web-b.loadbalancer.healthcheck.timeout=1s"
      - "traefik.http.services.control-plane-blue-web-b.loadbalancer.healthcheck.followredirects=false"
    networks: [control-plane]
    secrets:
      - source: blue-web-b-direct-probe-token
        target: control-plane-direct-probe-token
      - source: blue-web-b-applied-ack
        target: control-plane-applied-ack
      - source: blue-pool-route-health-token
        target: control-plane-route-health-token
      - source: blue-pool-ack
        target: control-plane-pool-ack
    volumes:
      - type: bind
        source: "${CONTROL_PLANE_RUNTIME_ENV_FILE:?CONTROL_PLANE_RUNTIME_ENV_FILE is required}"
        target: /var/www/html/.env
        read_only: true
      - "${CONTROL_PLANE_SSH_DIRECTORY:-/data/coolify/ssh}:/var/www/html/storage/app/ssh"
      - "${CONTROL_PLANE_APPLICATIONS_DIRECTORY:-/data/coolify/applications}:/var/www/html/storage/app/applications"
      - "${CONTROL_PLANE_DATABASES_DIRECTORY:-/data/coolify/databases}:/var/www/html/storage/app/databases"
      - "${CONTROL_PLANE_SERVICES_DIRECTORY:-/data/coolify/services}:/var/www/html/storage/app/services"
      - "${CONTROL_PLANE_BACKUPS_DIRECTORY:-/data/coolify/backups}:/var/www/html/storage/app/backups"
      - type: volume
        source: blue-web-b-private
        target: /var/lib/coolify-control-plane/private
      - type: volume
        source: control-plane-coordination
        target: /var/lib/coolify-control-plane/coordination

