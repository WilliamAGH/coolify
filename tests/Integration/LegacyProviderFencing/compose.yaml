services:
  switcher:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    command: ["/bin/sh", "-ec", "while :; do sleep 3600; done"]
    restart: "no"
    volumes:
      - dynamic:/dynamic
      - ./templates:/templates:ro
    networks: [fencing]

  legacy:
    build: ../BlueGreen/backend
    restart: "no"
    environment:
      REVISION: legacy
      STATE_DIRECTORY: /state
    labels:
      - coolify.legacy-fencing=true
      - traefik.enable=true
      - traefik.http.routers.legacy-router.entryPoints=web
      - traefik.http.routers.legacy-router.rule=PathPrefix(`/`)
      - traefik.http.routers.legacy-router.service=legacy-service
      - traefik.http.services.legacy-service.loadbalancer.server.port=3000
    volumes:
      - transaction-state:/state
    networks: [fencing]

  candidate:
    build: ../BlueGreen/backend
    restart: "no"
    environment:
      REVISION: candidate
      STATE_DIRECTORY: /state
    labels:
      - coolify.legacy-fencing=true
      - traefik.enable=false
    volumes:
      - ./probe.mjs:/probe/probe.mjs:ro
      - ./traffic.mjs:/probe/traffic.mjs:ro
      - transaction-state:/state
    networks: [fencing]

  traefik:
    image: ${TRAEFIK_IMAGE:?run.sh must set an immutable Traefik image digest}
    command: ["--configFile=/etc/traefik/traefik.yml"]
    restart: "no"
    depends_on:
      legacy:
        condition: service_started
      candidate:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dynamic:/etc/traefik/dynamic:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    networks: [fencing]

networks:
  fencing:
    driver: bridge

volumes:
  dynamic:
  transaction-state:
