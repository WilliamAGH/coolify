entryPoints:
  web:
    address: ":80"
  traefik:
    address: ":8080"
  metrics:
    address: ":8082"

api:
  dashboard: true
  insecure: true

accessLog:
  format: json
  bufferingSize: 0

log:
  format: json

metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    addServicesLabels: true

providers:
  providersThrottleDuration: 10s
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    constraints: Label(`coolify.legacy-fencing`,`true`)
  file:
    directory: /etc/traefik/dynamic
    watch: true
