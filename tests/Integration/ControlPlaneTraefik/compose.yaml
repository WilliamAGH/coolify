services:
  traefik:
    image: ${TRAEFIK_IMAGE:?}
    command:
      - --api.insecure=true
      - --entrypoints.https.address=:8443
      - --entrypoints.app-port.address=:8000
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --providers.providersThrottleDuration=250ms
      - --log.level=ERROR
    ports:
      - 127.0.0.1:${TRAEFIK_HTTPS_PORT:?}:8443
      - 127.0.0.1:${TRAEFIK_APP_PORT:?}:8000
      - 127.0.0.1:${TRAEFIK_API_PORT:?}:8080
    volumes:
      - control-plane-dynamic:/dynamic:ro
      - ${TRAEFIK_CERT_DIR:?}:/certs:ro
      - ${TRAEFIK_DOCKER_SOCKET:?}:/var/run/docker.sock:ro
    labels:
      traefik.enable: "false"
    networks:
      - control-plane

  config-writer:
    image: busybox:1.36.1
    command:
      - sh
      - -c
      - exec tail -f /dev/null
    volumes:
      - control-plane-dynamic:/dynamic
    networks:
      - control-plane

  backend-blue:
    image: node:22-alpine
    environment:
      BACKEND_INSTANCE: blue
      CONTROL_PLANE_HEALTH_PROOF: ${CONTROL_PLANE_HEALTH_PROOF:?}
      STATE_DIRECTORY: /state
    volumes:
      - ${BACKEND_BLUE_STATE_DIR:?}:/state
      - ${CONTROL_PLANE_TRAEFIK_SCRIPT_DIRECTORY:?}/backend-server.js:/backend-server.js:ro
      - ${CONTROL_PLANE_TRAEFIK_SCRIPT_DIRECTORY:?}/transport-observer.js:/transport-observer.js:ro
    command: ['node', '/backend-server.js']
    labels:
      traefik.enable: "true"
      traefik.http.routers.integration-docker-provider.rule: "Host(`docker-provider.test`)"
      traefik.http.routers.integration-docker-provider.entrypoints: https
      traefik.http.routers.integration-docker-provider.tls: "true"
      traefik.http.routers.integration-docker-provider.service: integration-docker-provider
      traefik.http.services.integration-docker-provider.loadbalancer.server.port: "8080"
    networks:
      - control-plane

  backend-green:
    image: node:22-alpine
    environment:
      BACKEND_INSTANCE: green
      CONTROL_PLANE_HEALTH_PROOF: ${CONTROL_PLANE_HEALTH_PROOF:?}
      STATE_DIRECTORY: /state
    volumes:
      - ${BACKEND_GREEN_STATE_DIR:?}:/state
      - ${CONTROL_PLANE_TRAEFIK_SCRIPT_DIRECTORY:?}/backend-server.js:/backend-server.js:ro
      - ${CONTROL_PLANE_TRAEFIK_SCRIPT_DIRECTORY:?}/transport-observer.js:/transport-observer.js:ro
    command: ['node', '/backend-server.js']
    labels:
      traefik.enable: "true"
      traefik.http.services.integration-backend-green.loadbalancer.server.port: "8080"
    networks:
      - control-plane

networks:
  control-plane:
    name: ${COMPOSE_PROJECT_NAME:?}_control-plane

volumes:
  control-plane-dynamic:
