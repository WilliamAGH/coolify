            response.end();
            return;
          }

          append('route.log', [instance, requestPath]);
          response.writeHead(200, responseHeaders());
          response.end(instance);
        }).listen(8080, '0.0.0.0');
    labels:
      traefik.enable: "true"
      traefik.http.services.integration-backend-green.loadbalancer.server.port: "8080"
    networks:
      - control-plane

networks:
  control-plane:
    name: ${COMPOSE_PROJECT_NAME:?}_control-plane

volumes:
  control-plane-dynamic:
