services:
  proxy:
    image: "traefik:v3.6.23@sha256:f5dba1e65167778cd5f8d1b463fc5d200f49d40c6458fc9f4b391a68ebfb9534"
    container_name: "${CONTROL_PLANE_PROXY_CONTAINER:?CONTROL_PLANE_PROXY_CONTAINER is required}"
    command:
      - "--api.insecure=false"
      - "--configFile=/etc/traefik/traefik.yml"
    restart: "no"
    ports:
      - "127.0.0.1:${LAB_TRAEFIK_PORT:?LAB_TRAEFIK_PORT is required}:443"
      - "127.0.0.1:8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: "${LAB_DYNAMIC_DIR:?LAB_DYNAMIC_DIR is required}"
        target: /traefik/dynamic
        read_only: true
      - type: bind
        source: "${LAB_TRAEFIK_STATIC_CONFIG:?LAB_TRAEFIK_STATIC_CONFIG is required}"
        target: /etc/traefik/traefik.yml
        read_only: true
      - type: bind
        source: "${LAB_TRAEFIK_TLS_DIRECTORY:?LAB_TRAEFIK_TLS_DIRECTORY is required}"
        target: /etc/traefik/tls
        read_only: true
    networks:
      - lab

  database:
    image: "postgres:15.18-alpine3.24@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f"
    container_name: "${CONTROL_PLANE_DATABASE_CONTAINER:?CONTROL_PLANE_DATABASE_CONTAINER is required}"
    restart: "no"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./database-init.sql:/docker-entrypoint-initdb.d/01-queue.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 1s
      retries: 30
    networks:
      - lab

  rehearsal-database:
    image: "postgres:15.18-alpine3.24@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f"
    container_name: "${CONTROL_PLANE_REHEARSAL_DATABASE_CONTAINER:?CONTROL_PLANE_REHEARSAL_DATABASE_CONTAINER is required}"
    restart: "no"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./database-init.sql:/docker-entrypoint-initdb.d/01-queue.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 1s
      retries: 30
    networks:
      - rehearsal

  redis:
    image: "${CONTROL_PLANE_GREEN_IMAGE:?CONTROL_PLANE_GREEN_IMAGE is required}"
    container_name: "${CONTROL_PLANE_REDIS_CONTAINER:?CONTROL_PLANE_REDIS_CONTAINER is required}"
    restart: "no"
    entrypoint: ["/usr/local/bin/control-plane-lab-dependency", "6379"]
    networks:
      - lab

  realtime:
    image: "${CONTROL_PLANE_GREEN_IMAGE:?CONTROL_PLANE_GREEN_IMAGE is required}"
    container_name: "${CONTROL_PLANE_SOKETI_CONTAINER:?CONTROL_PLANE_SOKETI_CONTAINER is required}"
    restart: "no"
    entrypoint: ["/usr/local/bin/control-plane-lab-dependency", "6001", "6002"]
    networks:
      - lab

networks:
  lab:
    name: "${CONTROL_PLANE_NETWORK:?CONTROL_PLANE_NETWORK is required}"
    external: true
  rehearsal:
    name: "${CONTROL_PLANE_REHEARSAL_NETWORK:?CONTROL_PLANE_REHEARSAL_NETWORK is required}"
    external: true
